name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Fetch and optimize carrier logos
        run: npm run assets:carriers
      - name: Run unit and build parity tests
        run: npm test
      - name: Build embedded web content
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Generate Android app icon and splash
        run: npm run assets:android
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apn-atlas-vn-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

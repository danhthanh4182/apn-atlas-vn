name: iOS signed IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$IOS_CERTIFICATE_P12_BASE64" || { echo "Missing IOS_CERTIFICATE_P12_BASE64"; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo "Missing IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo "Missing IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }
          test -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" || { echo "Missing IOS_EXPORT_OPTIONS_PLIST_BASE64"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Fetch and optimize carrier logos
        run: npm run assets:carriers
      - name: Generate iOS app and assets
        run: npm run build:web && npx cap add ios && npx cap sync ios && npm run assets:ios
      - name: Install Apple signing material
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 -D > "$RUNNER_TEMP/ExportOptions.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/apn-atlas.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/apn-atlas.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive signed app
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/APNAtlasVN.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" archive
      - name: Export IPA
        run: |
          mkdir -p dist/ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/APNAtlasVN.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath dist/ios
      - uses: actions/upload-artifact@v4
        with:
          name: apn-atlas-vn-ios-signed-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error
      - name: Remove signing materials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/profile.plist"
          security delete-keychain "$RUNNER_TEMP/apn-atlas.keychain-db" || true

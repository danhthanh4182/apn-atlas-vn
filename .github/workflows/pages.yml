name: Web · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: apn-atlas-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch and optimize carrier logos
        run: npm run assets:carriers
      - name: Test catalog and web/native parity
        run: npm test
      - name: Build static site
        run: npm run build:site
      - name: Upload downloadable web artifact
        uses: actions/upload-artifact@v4
        with:
          name: apn-atlas-vn-web
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages is enabled
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
